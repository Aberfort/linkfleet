server {
    listen 80;
    server_name localhost;

    # backend ("app") speaks plain HTTP (php artisan serve), same image as
    # the Railway deploy — no php-fpm/fastcgi involved here.
    # /qr, /lf.js and /lf.gif are public backend routes too: QR images, and the
    # conversion snippet with the pixel it calls.
    location ~ ^/((api|r|qr)(/|$)|lf\.(js|gif)$) {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://react_app:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Захист від доступу до прихованих файлів
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
